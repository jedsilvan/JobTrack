services:
  backend:
    build: ./backend
    container_name: jobtrack_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin@host.docker.internal:5432/jobtrack
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: jobtrack_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend